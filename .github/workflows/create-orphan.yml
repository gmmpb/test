name: Create Orphan Process - Demonstrate Problem

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  create-orphan:
    runs-on: self-hosted
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show initial state
        run: |
          echo "=== BEFORE CREATING ORPHAN ==="
          echo "Current processes with 'orphan' in name:"
          ps aux | grep orphan | grep -v grep || echo "No orphan processes found"
          echo "Marker files:"
          ls -la /tmp/*marker*.txt 2>/dev/null || echo "No marker files found"

      - name: Create orphan process
        run: |
          echo "=== CREATING ORPHAN PROCESS ==="
          echo "This will create a long-running orphan process..."
          python3 orphan_process_test.py orphan &
          sleep 5

      - name: Show orphan process is running
        run: |
          echo "=== ORPHAN PROCESS CREATED ==="
          echo "Orphan processes:"
          ps aux | grep orphan | grep -v grep || echo "No orphan processes found"
          echo "Marker files (proof orphan is running):"
          ls -la /tmp/*marker*.txt 2>/dev/null || echo "No marker files found"

          echo ""
          echo "🚨 WARNING: Orphan process will continue running after this job ends!"
          echo "🚨 The process will run for ~2.5 minutes (30 iterations x 5 seconds)"
          echo "🚨 You can check it's still there after the job completes"
