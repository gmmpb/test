name: Simple Test for Self-Hosted Runner

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  simple-test:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          echo "=== Runner Environment Info ==="
          echo "Hostname: $(hostname)"
          echo "Operating System: $(uname -a)"
          echo "User: $(whoami)"
          echo "Current directory: $(pwd)"
          echo "Date: $(date)"
          echo "Uptime: $(uptime)"

      - name: Test Python availability
        run: |
          echo "=== Python Environment ==="
          which python3
          python3 --version
          echo "Python executable: $(which python3)"

      - name: Run simple Python test
        run: |
          echo "=== Running Python Test ==="
          python3 -c "
          import os
          import sys
          print(f'Python version: {sys.version}')
          print(f'Current PID: {os.getpid()}')
          print(f'Working directory: {os.getcwd()}')
          print('Self-hosted runner is working!')
          "

      - name: List project files
        run: |
          echo "=== Project Files ==="
          ls -la
          echo "=== Python Scripts ==="
          ls -la *.py

      - name: Test our scripts exist and are executable
        run: |
          echo "=== Testing Script Availability ==="
          test -f orphan_process_test.py && echo "✅ orphan_process_test.py exists" || echo "❌ orphan_process_test.py missing"
          test -f cleanup_script.py && echo "✅ cleanup_script.py exists" || echo "❌ cleanup_script.py missing"

          echo "Testing script execution:"
          python3 orphan_process_test.py list
