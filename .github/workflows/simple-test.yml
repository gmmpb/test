name: Simple Test for Self-Hosted Runner

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  simple-test:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          echo "=== Runner Environment Info ==="
          echo "Hostname: $(hostname)"
          echo "Operating System: $(uname -a)"
          echo "User: $(whoami)"
          echo "Current directory: $(pwd)"
          echo "Date: $(date)"
          echo "Uptime: $(uptime)"

      - name: Test Python availability
        run: |
          echo "=== Python Environment ==="
          which python3
          python3 --version
          echo "Python executable: $(which python3)"

      - name: Run simple Python test
        run: |
          echo "=== Running Python Test ==="
          python3 -c "
          import os
          import sys
          print(f'Python version: {sys.version}')
          print(f'Current PID: {os.getpid()}')
          print(f'Working directory: {os.getcwd()}')
          print('Self-hosted runner is working!')
          "

      - name: List project files
        run: |
          echo "=== Project Files ==="
          ls -la
          echo "=== Python Scripts ==="
          ls -la *.py

      - name: Create orphan process to demonstrate the problem
        run: |
          echo "=== CREATING ORPHAN PROCESS ==="
          echo "⚠️  This will create a process that survives after the job ends!"

          # Create an orphan process
          python3 orphan_process_test.py orphan &

          sleep 3
          echo "Checking for orphan processes..."
          python3 orphan_process_test.py list

          echo "⚠️  Job ending - but orphan process will continue running!"
          echo "⚠️  Check your system with 'ps aux | grep orphan' after this job completes"
