name: Test Self-Hosted Runner - Orphan Processes

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of test to run"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - orphan
          - background
          - cleanup

jobs:
  test-orphan-processes:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Show system info
        run: |
          echo "Runner info:"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          echo "Python version: $(python3 --version)"
          echo "Process count before test: $(ps aux | wc -l)"

      - name: List existing processes
        run: |
          echo "Current Python processes:"
          ps aux | grep python | grep -v grep || echo "No Python processes found"
          echo "Existing marker files:"
          ls -la /tmp/*marker*.txt 2>/dev/null || echo "No marker files found"

      - name: Test basic functionality
        if: github.event.inputs.test_type == 'basic' || github.event.inputs.test_type == ''
        run: |
          echo "Running basic test..."
          python3 orphan_process_test.py list

      - name: Test orphan process creation
        if: github.event.inputs.test_type == 'orphan'
        run: |
          echo "Creating orphan process..."
          python3 orphan_process_test.py orphan &
          sleep 3
          echo "Checking for orphan processes..."
          python3 orphan_process_test.py list

      - name: Test background process creation
        if: github.event.inputs.test_type == 'background'
        run: |
          echo "Creating background process..."
          python3 orphan_process_test.py background
          sleep 5
          echo "Checking for background processes..."
          python3 orphan_process_test.py list

      - name: Test cleanup functionality
        if: github.event.inputs.test_type == 'cleanup'
        run: |
          echo "Testing cleanup functionality..."
          # First create some processes to clean up
          python3 orphan_process_test.py background
          sleep 2
          echo "Before cleanup:"
          python3 cleanup_script.py list
          echo "Running cleanup:"
          python3 cleanup_script.py cleanup
          echo "After cleanup:"
          python3 cleanup_script.py list

      - name: Show final process state
        run: |
          echo "Final process count: $(ps aux | wc -l)"
          echo "Remaining Python processes:"
          ps aux | grep python | grep -v grep || echo "No Python processes found"
          echo "Remaining marker files:"
          ls -la /tmp/*marker*.txt 2>/dev/null || echo "No marker files found"

      - name: Emergency cleanup (always run)
        if: always()
        run: |
          echo "Running emergency cleanup..."
          python3 cleanup_script.py force || echo "Emergency cleanup completed with warnings"
