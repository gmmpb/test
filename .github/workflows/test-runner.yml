name: Test Self-Hosted Runner - Orphan Processes

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'demonstrate_problem'
        type: choice
        options:
        - demonstrate_problem
        - test_basic_cleanup
        - test_process_groups
        - test_aggressive_cleanupted Runner - Orphan Processes

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of test to run"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - orphan
          - background
          - cleanup

jobs:
  test-orphan-processes:
    runs-on: self-hosted
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Show system info
      run: |
        echo "Runner info:"
        echo "Hostname: $(hostname)"
        echo "User: $(whoami)"
        echo "Working directory: $(pwd)"
        echo "Python version: $(python3 --version)"
        echo "Process count before test: $(ps aux | wc -l)"
        
    - name: Show initial state
      run: |
        echo "=== INITIAL STATE ==="
        python3 orphan_process_test.py list
        
    - name: STEP 1 - Demonstrate the orphan process problem
      if: github.event.inputs.test_type == 'demonstrate_problem' || github.event.inputs.test_type == ''
      run: |
        echo "=== DEMONSTRATING ORPHAN PROCESS PROBLEM ==="
        echo "Creating orphan processes that will survive job completion..."
        
        # Create multiple types of orphan processes
        echo "1. Creating fork-based orphan process..."
        python3 orphan_process_test.py orphan &
        
        echo "2. Creating subprocess-based background process..."
        python3 orphan_process_test.py background
        
        sleep 5
        echo "Current state after creating orphans:"
        python3 orphan_process_test.py list
        
        echo "⚠️  These processes will continue running after the job ends!"
        echo "⚠️  This demonstrates the orphan process problem."
        
    - name: STEP 2 - Test basic cleanup methods
      if: github.event.inputs.test_type == 'test_basic_cleanup'
      run: |
        echo "=== TESTING BASIC CLEANUP METHODS ==="
        
        # First create the problem
        echo "Creating orphan processes..."
        python3 orphan_process_test.py orphan &
        python3 orphan_process_test.py background
        sleep 5
        
        echo "Before cleanup:"
        python3 orphan_process_test.py list
        
        echo "Method 1: Using our Python cleanup script..."
        python3 cleanup_script.py cleanup
        
        sleep 2
        echo "After Python cleanup:"
        python3 orphan_process_test.py list
        
        echo "Method 2: Using pkill commands..."
        pkill -f orphan_process_test || echo "No orphan_process_test processes found"
        pkill -f background_script || echo "No background_script processes found"
        
        sleep 2
        echo "After pkill cleanup:"
        python3 orphan_process_test.py list
        
    - name: STEP 3 - Test process group solutions
      if: github.event.inputs.test_type == 'test_process_groups'
      run: |
        echo "=== TESTING PROCESS GROUP SOLUTIONS ==="
        
        echo "Creating orphan processes with process groups..."
        python3 enhanced_orphan_test.py pgroup_orphan &
        python3 enhanced_orphan_test.py pgroup_subprocess &
        sleep 5
        
        echo "Before cleanup:"
        python3 enhanced_orphan_test.py list
        
        echo "Using process group cleanup..."
        python3 enhanced_orphan_test.py cleanup
        
        sleep 2
        echo "After process group cleanup:"
        python3 enhanced_orphan_test.py list
        
    - name: STEP 4 - Test aggressive cleanup
      if: github.event.inputs.test_type == 'test_aggressive_cleanup'
      run: |
        echo "=== TESTING AGGRESSIVE CLEANUP ==="
        
        # Create many different types of processes
        echo "Creating multiple orphan processes..."
        python3 orphan_process_test.py orphan &
        python3 orphan_process_test.py background
        python3 enhanced_orphan_test.py pgroup_orphan &
        python3 enhanced_orphan_test.py pgroup_subprocess &
        sleep 5
        
        echo "Before cleanup:"
        ./runner_cleanup.sh monitor
        
        echo "Running aggressive cleanup..."
        ./runner_cleanup.sh aggressive
        
        sleep 2
        echo "After aggressive cleanup:"
        ./runner_cleanup.sh monitor

        
    - name: Show final process state
      run: |
        echo "=== FINAL PROCESS STATE ==="
        echo "Final process count: $(ps aux | wc -l)"
        echo "Remaining Python processes:"
        ps aux | grep python | grep -v grep || echo "No Python processes found"
        echo "Remaining marker files:"
        ls -la /tmp/*marker*.txt 2>/dev/null || echo "No marker files found"
        
        echo "=== SUMMARY ==="
        if ps aux | grep -E "(orphan_process_test|background_script)" | grep -v grep; then
          echo "⚠️  WARNING: Orphan processes still running!"
        else
          echo "✅ No orphan processes detected"
        fi
        
    - name: Emergency cleanup (always run)
      if: always()
      run: |
        echo "=== EMERGENCY CLEANUP ==="
        echo "This runs regardless of job success/failure"
        
        # Always try to clean up at the end
        python3 cleanup_script.py force 2>/dev/null || echo "Python cleanup completed with warnings"
        ./runner_cleanup.sh cleanup 2>/dev/null || echo "Shell cleanup completed with warnings"
        
        # Show final state
        echo "Post-cleanup process count: $(ps aux | wc -l)"